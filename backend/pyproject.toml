[project]
name = "jirou-backend"
version = "0.1.0"
description = "Jirou — backend API (FastAPI) pour un clone de Jira"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 n'est pas compatible avec bcrypt >= 4.1 (lecture de version
    # cassée -> ValueError). On borne bcrypt sur la série 4.0.x.
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (isort), UP (pyupgrade), B (bugbear), C4, SIM
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008 : appeler Depends() dans les défauts d'arguments est l'idiome d'injection FastAPI.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
