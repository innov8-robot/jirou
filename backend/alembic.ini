# Configuration Alembic pour Jirou.
# L'URL de base de données N'EST PAS définie ici : elle est lue depuis
# la config de l'application (app.core.config.settings) dans alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Format de nom des fichiers de révision : horodaté + slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
path_separator = os
# sqlalchemy.url est volontairement laissé vide ; voir alembic/env.py.
sqlalchemy.url =

[post_write_hooks]
# Formate/lint automatiquement les migrations générées avec ruff.
hooks = ruff_format ruff_fix
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
